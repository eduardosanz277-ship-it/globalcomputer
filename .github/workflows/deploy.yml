name: Deploy (Supabase link + seed)

on:
  push:
    tags:
      - "v*"

jobs:
  check-tag-on-develop:
    runs-on: ubuntu-latest
    outputs:
      on_develop: ${{ steps.check.outputs.on_develop }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Comprobar si el tag está en develop
        id: check
        run: |
          git fetch origin develop
          if git branch -r --contains ${{ github.sha }} | grep -q 'origin/develop'; then
            echo "on_develop=true" >> $GITHUB_OUTPUT
            echo "El tag ${{ github.ref_name }} está en develop. Se ejecutará el deploy."
          else
            echo "on_develop=false" >> $GITHUB_OUTPUT
            echo "El tag ${{ github.ref_name }} no está en la rama develop. Deploy omitido."
          fi

  deploy:
    needs: check-tag-on-develop
    if: needs.check-tag-on-develop.outputs.on_develop == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Instalar Supabase CLI
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Verificar CLI
      - name: Supabase version
        run: supabase --version

      - name: Supabase link y db push (migraciones en supabase/migrations)
        run: |
          supabase link --project-ref $SUPABASE_PROJECT_REF
          supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Seed default admin
        run: |
          export NEXT_PUBLIC_SUPABASE_URL="https://${SUPABASE_PROJECT_REF}.supabase.co"
          node scripts/seed-admin.mjs
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_FULL_NAME: ${{ secrets.ADMIN_FULL_NAME }}
          ADMIN_ROLE: ${{ secrets.ADMIN_ROLE }}

      # Deploy a Vercel
      - name: Deploy to Vercel
        run: |
          npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          echo "== Preflight Supabase envs desde .vercel/.env.production.local =="
          ENV_FILE=".vercel/.env.production.local"
          if [ ! -f "$ENV_FILE" ]; then
            echo "ERROR: no existe $ENV_FILE tras vercel pull." >&2
            exit 1
          fi

          has_key() {
            local key="$1"
            grep -Eq "^${key}=" "$ENV_FILE"
          }

          if has_key "NEXT_PUBLIC_SUPABASE_URL"; then
            echo "NEXT_PUBLIC_SUPABASE_URL: OK"
          elif has_key "SUPABASE_URL"; then
            echo "SUPABASE_URL: OK (fallback)"
          else
            echo "NEXT_PUBLIC_SUPABASE_URL/SUPABASE_URL: MISSING"
            echo "ERROR: falta URL de Supabase en entorno Production de Vercel." >&2
            exit 1
          fi

          if has_key "NEXT_PUBLIC_SUPABASE_ANON_KEY"; then
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY: OK"
          elif has_key "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY"; then
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: OK (fallback)"
          elif has_key "SUPABASE_ANON_KEY"; then
            echo "SUPABASE_ANON_KEY: OK (fallback)"
          else
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY / NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY / SUPABASE_ANON_KEY: MISSING"
            echo "ERROR: falta key pública de Supabase en entorno Production de Vercel." >&2
            exit 1
          fi

          npx vercel build --prod --token=$VERCEL_TOKEN
          npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Notificación a Telegram al final
      - name: Notify Telegram Success
        if: success()
        run: |
          NOW=$(date +"%Y-%m-%d %H:%M:%S")
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="✅ *Global Computers USA* workflow terminó correctamente en la rama *${GITHUB_REF_NAME}* a las ${NOW} (Run: ${GITHUB_RUN_ID})"
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Notify Telegram Failure
        if: failure()
        run: |
          NOW=$(date +"%Y-%m-%d %H:%M:%S")
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="❌ *Global Computers USA* workflow falló en la rama *${GITHUB_REF_NAME}* a las ${NOW} (Run: ${GITHUB_RUN_ID})"
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
